name: Validate pilot package

on:
  pull_request:
  push:
    branches: [main, 'codex/**']

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/package.py check
      - run: python -m unittest discover -s tests -v
      - run: python scripts/package.py build
      - run: git diff --exit-code
      - name: Upload validated plugin package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: legal-ai-pl-package
          path: |
            dist/legal-ai-pl-*.zip
            dist/legal-ai-pl-*.zip.sha256
          if-no-files-found: error
          retention-days: 30
