name: Initialize and validate WSA skill
on:
  push:
    branches: ['codex/legal-ai-next-deployments-0.10.0']
    paths: ['.github/legal-ai-scaffold/**', '.github/workflows/scaffold-wsa.yml']
permissions:
  contents: read
jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - name: Initialize, overlay and validate skill
        env:
          SCAFFOLD_ROOT: ${{ runner.temp }}/legal-ai-scaffold
        run: |
          python .github/legal-ai-scaffold/init_skill.py pl-wsa-complaint --path "$SCAFFOLD_ROOT" --resources references --interface 'display_name=WSA - decyzja powrotowa' --interface 'short_description=Skarga WSA i osobna ocena wykonania decyzji powrotowej' --interface 'default_prompt=Użyj $pl-wsa-complaint do oceny ostatecznej decyzji powrotowej, koncepcji skargi WSA i odrębnej oceny wykonania.'
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["SCAFFOLD_ROOT"]) / "pl-wsa-complaint"
          payload = json.loads(Path(".github/legal-ai-scaffold/payload.json").read_text(encoding="utf-8"))
          for name, content in payload.items():
              target = root / name
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding="utf-8", newline="\n")
          PY
          python .github/legal-ai-scaffold/quick_validate.py "$SCAFFOLD_ROOT/pl-wsa-complaint"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["SCAFFOLD_ROOT"]) / "pl-wsa-complaint"
          files = {p.relative_to(root).as_posix(): p.read_text(encoding="utf-8") for p in sorted(root.rglob("*")) if p.is_file()}
          print("SCAFFOLD_RESULT=" + json.dumps(files, ensure_ascii=False))
          PY
